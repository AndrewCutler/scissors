name: Build and deploy ASP.Net Core app to Azure Container App - scissors-api

on:
    push:
        tags:
            - "api-v*"
    workflow_dispatch:

env:
    APP_NAME: scissors-api
    RESOURCE_GROUP: scissors-api_group
    REGISTRY: scissorsacr
    IMAGE_NAME: scissors-api
    IMAGE_REF: scissorsacr.azurecr.io/scissors-api:${{ github.sha }}

jobs:
    build:
        runs-on: ubuntu-latest
        permissions:
            contents: read
            id-token: write

        steps:
            - uses: actions/checkout@v4

            - name: Set up .NET Core
              uses: actions/setup-dotnet@v4
              with:
                  dotnet-version: "10.x"

            - name: Restore API
              run: dotnet restore Scissors.API/Scissors.API.csproj

            - name: Build API
              run: dotnet build Scissors.API/Scissors.API.csproj --configuration Release --no-restore

            - name: Build Docker image
              run: |
                  docker build \
                    -t ${{ env.IMAGE_REF }} \
                    -f Scissors.API/Dockerfile \
                    .

            - name: Login to Azure
              uses: azure/login@v2
              with:
                  client-id: ${{ secrets.AZURE_CLIENT_ID }}
                  tenant-id: ${{ secrets.AZURE_TENANT_ID }}
                  subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

            - name: Login to Azure Container Registry
              run: az acr login --name ${{ env.REGISTRY }}

            - name: Push Docker image
              run: |
                  docker push "${{ env.IMAGE_REF }}"

            - name: Install EF Core CLI
              run: dotnet tool install dotnet-ef --tool-path ./.tools --version 10.0.10

            - name: Apply database migrations
              run: |
                  ./.tools/dotnet-ef database update \
                  --project Scissors.API/Scissors.API.csproj \
                  --startup-project Scissors.API/Scissors.API.csproj \
                  --configuration Release \
                  --no-build
              env:
                  ConnectionStrings__Postgres: ${{ secrets.PRODUCTION_CONNECTION_STRING }}

            - name: Deploy revision
              run: |
                  az containerapp update \
                  --name "${{ env.APP_NAME }}" \
                  --resource-group "${{ env.RESOURCE_GROUP }}" \
                  --image "${{ env.IMAGE_REF}}"
