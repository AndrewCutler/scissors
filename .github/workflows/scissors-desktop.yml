# CODEX-MODIFIED: the contents of this file were written by a human and modified after the fact by a Codex agent.
name: Build and package Scissors.Desktop Windows installer

on:
    push:
        tags:
            - "desktop-v*"
    workflow_dispatch:

env:
    APP_NAME: scissors-desktop

jobs:
    build:
        runs-on: windows-latest
        permissions:
            contents: read

        steps:
            - name: Check out repository
              uses: actions/checkout@v4

            - name: Set up .NET
              uses: actions/setup-dotnet@v4
              with:
                  dotnet-version: "10.x"

            - name: Read desktop version
              shell: pwsh
              run: |
                  if ($env:GITHUB_REF_NAME -match '^desktop-v(.+)$') {
                      $version = $Matches[1]
                  } else {
                      $version = "0.0.0-dev.${env:GITHUB_RUN_NUMBER}"
                  }
                  "APP_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

            - name: Publish desktop app
              shell: pwsh
              run: >-
                  dotnet publish Scissors.Desktop/Scissors.Desktop.csproj
                  --configuration Release
                  --runtime win-x64
                  --self-contained true
                  --output artifacts/desktop-publish
                  -p:Version=$env:APP_VERSION

            - name: Install Inno Setup
              shell: pwsh
              run: choco install innosetup --no-progress --yes

            - name: Build installer
              shell: pwsh
              run: >-
                  & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
                  /DAppVersion=$env:APP_VERSION
                  installer/Scissors.Desktop.iss

            - name: Upload installer
              uses: actions/upload-artifact@v4
              with:
                  name: ${{ env.APP_NAME }}-${{ env.APP_VERSION }}
                  path: artifacts/desktop-installer/*.exe
                  if-no-files-found: error
