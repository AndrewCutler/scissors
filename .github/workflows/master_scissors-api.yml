# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy ASP.Net Core app to Azure Container App - scissors-api

on:
  push:
    branches:
      - master
  workflow_dispatch:

env:
  REGISTRY: scissorsacr
  IMAGE_NAME: scissors-api

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Restore API
        run: dotnet restore Scissors.API/Scissors.API.csproj

      - name: Build API
        run: dotnet build Scissors.API/Scissors.API.csproj --configuration Release --no-restore

      - name: Build Docker image
        run: |
          docker build \
            -t ${{ env.REGISTRY }}.azurecr.io/${{ env.IMAGE_NAME }}:${{ github.sha }} \
            -f Scissors.API/Dockerfile \
            .
            
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          
      - name: Login to Azure Container Registry
        run: az acr login --name ${{ env.REGISTRY }}

      - name: Push Docker image
        run: |
          docker push ${{ env.REGISTRY }}.azurecr.io/${{ env.IMAGE_NAME }}:${{ github.sha }}
          
