# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy ASP.Net Core app to Azure Web App - scissors-api

on:
  push:
    branches:
      - master
  workflow_dispatch:

env:
  REGISTRY: scissorsacr
  IMAGE_NAME: scissors-api

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Restore API
        run: dotnet restore Scissors.API/Scissors.API.csproj

      - name: Build API
        run: dotnet build Scissors.API/Scissors.API.csproj --configuration Release --no-restore

      - name: Build Docker image
        run: |
          docker build `
            -t ${{ env.REGISTRY }}.azureacr.io/${{ env.IMAGE_NAME }}:${{ github.sha }} `
            -f Scissors.API/Dockerfile `
            .
            
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_05C56BF7987F4EA38A59FA313B4AE2E6 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_FDE5AB2BA4924EA88FBDEAAF846A5C20 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_5D2D5C616B8348148F26B640D1C2D552 }}
          
      - name: Login to Azure Container Registry
        run: az acr login --name ${{ env.REGISTRY }}

      - name: Push Docker image
        run: |
          docker push ${{ env.REGISTRY }}.azureacr.io/${{ env.IMAGE_NAME }}:${{ github.sha }}
          
