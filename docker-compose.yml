services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: scissors
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  api:
    build:
      context: .
      dockerfile: Scissors.API/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Postgres: Host=db;Port=5432;Database=scissors;Username=postgres;Password=postgres
    ports:
      - "5098:8080"
    depends_on:
      - db

